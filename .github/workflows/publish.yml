name: Publish

# Cut the tag from a commit whose CI run is green:
#   git tag -a v0.1.0 -m "ContractBreaker 0.1.0"
#   git push origin v0.1.0
# Requires a PyPI trusted publisher for workflow "publish.yml",
# environment "pypi", in this repository.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade build twine

      - name: Build the sdist and wheel
        run: python -m build

      - name: Check the distribution metadata
        run: python -m twine check dist/*

      - name: Upload the distribution
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/contractbreaker
    permissions:
      id-token: write
    steps:
      - name: Download the distribution
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
