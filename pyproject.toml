[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contractbreaker"
version = "0.1.0"
description = "Deterministic causal verification of retry/timeout conflicts"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "flask>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
llm = ["openai>=1.40"]

[project.scripts]
contractbreaker = "contractbreaker.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["contractbreaker*", "examples*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
