[project]
name = "contractbreaker"
version = "0.1.0"
description = "Test-proven detection of retry/timeout conflicts between a client and a service"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "flask>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
